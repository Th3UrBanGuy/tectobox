name: Continuous Deployment (CD) to VPS

on:
  workflow_run:
    workflows: ["Release & Publish Container Images"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      target_host:
        description: 'Target VPS IP / Host (leave blank to use secret VPS_HOST)'
        required: false
        default: ''
      custom_domain:
        description: 'Domain for SSL/TLS via Caddy (leave blank to use secret DOMAIN)'
        required: false
        default: ''

jobs:
  deploy-to-vps:
    runs-on: ubuntu-latest
    # Run only if the Release workflow succeeded or if triggered manually
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check VPS Secrets Configuration
        id: check-secrets
        run: |
          TARGET_HOST="${{ inputs.target_host || secrets.VPS_HOST }}"
          VPS_USER="${{ secrets.VPS_USERNAME }}"
          VPS_KEY="${{ secrets.VPS_SSH_KEY }}"
          VPS_PORT="${{ secrets.VPS_PORT }}"
          TARGET_DOMAIN="${{ inputs.custom_domain || secrets.DOMAIN }}"

          MISSING_SECRETS=()
          [ -z "$TARGET_HOST" ] && MISSING_SECRETS+=("VPS_HOST")
          [ -z "$VPS_USER" ] && MISSING_SECRETS+=("VPS_USERNAME")
          [ -z "$VPS_KEY" ] && MISSING_SECRETS+=("VPS_SSH_KEY")
          [ -z "$VPS_PORT" ] && MISSING_SECRETS+=("VPS_PORT")
          [ -z "$TARGET_DOMAIN" ] && MISSING_SECRETS+=("DOMAIN")

          if [ ${#MISSING_SECRETS[@]} -ne 0 ]; then
            echo "::error ::Missing required deployment secret(s): ${MISSING_SECRETS[*]}" >&2
            echo "To enable deployment, configure the required secrets in Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

          echo "target_host=$TARGET_HOST" >> $GITHUB_OUTPUT
          echo "target_domain=$TARGET_DOMAIN" >> $GITHUB_OUTPUT

      - name: Guard RabbitMQ definitions against committed credentials (C6)
        run: |
          if grep -Eqi '"password(_hash)?"[[:space:]]*:' infra/rabbitmq/definitions.json; then
            echo "::error ::Security check failed: infra/rabbitmq/definitions.json contains a password field!" >&2
            exit 1
          fi
          echo "Verified infra/rabbitmq/definitions.json contains no committed passwords."

      - name: Prepare Deployment Bundle
        run: |
          mkdir -p bundle/infra/caddy bundle/infra/postgres bundle/infra/rabbitmq bundle/scripts
          cp infra/docker-compose.prod.yml bundle/infra/
          cp infra/caddy/Caddyfile bundle/infra/caddy/
          cp infra/postgres/init.sql bundle/infra/postgres/
          cp infra/postgres/schema.sql bundle/infra/postgres/
          cp infra/rabbitmq/definitions.json bundle/infra/rabbitmq/
          cp scripts/deploy.sh bundle/scripts/
          cp scripts/vps-setup.sh bundle/scripts/
          cp scripts/migrate.sh bundle/scripts/
          chmod +x bundle/scripts/*.sh
          tar -czf tectobox-deploy.tar.gz -C bundle .

      - name: Deploy to VPS via SSH & Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.check-secrets.outputs.target_host }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GITHUB_SHA,DOMAIN_INPUT
          script: |
            set -e
            echo "=== Connected to VPS: $(hostname) at $(date) ==="

            # 1. Ensure installation directory
            mkdir -p /opt/tectobox/infra/caddy /opt/tectobox/infra/postgres /opt/tectobox/infra/rabbitmq /opt/tectobox/scripts
            cd /opt/tectobox

            # 2. Check if Docker is installed, install if needed
            if ! command -v docker >/dev/null 2>&1; then
              echo "[+] Installing Docker on VPS..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable --now docker
            fi

            # 3. Download/sync deployment scripts and compose directly from GitHub
            echo "[+] Syncing configuration files from repository..."
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/infra/docker-compose.prod.yml" -o /opt/tectobox/infra/docker-compose.prod.yml
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/infra/caddy/Caddyfile" -o /opt/tectobox/infra/caddy/Caddyfile
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/infra/postgres/init.sql" -o /opt/tectobox/infra/postgres/init.sql
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/infra/postgres/schema.sql" -o /opt/tectobox/infra/postgres/schema.sql
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/infra/rabbitmq/definitions.json" -o /opt/tectobox/infra/rabbitmq/definitions.json
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/deploy.sh" -o /opt/tectobox/scripts/deploy.sh
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/migrate.sh" -o /opt/tectobox/scripts/migrate.sh
            chmod +x /opt/tectobox/scripts/*.sh

            # 4. Set domain idempotently if passed
            if [ -n "$DOMAIN_INPUT" ]; then
              touch /opt/tectobox/.env
              if grep -q '^DOMAIN=' /opt/tectobox/.env; then
                sed -i "s|^DOMAIN=.*|DOMAIN=${DOMAIN_INPUT}|" /opt/tectobox/.env
              else
                echo "DOMAIN=${DOMAIN_INPUT}" >> /opt/tectobox/.env
              fi
            fi

            # 5. Execute production zero-downtime deployment
            export IMAGE_REPO_OWNER="${{ github.repository_owner }}"
            export IMAGE_TAG="${GITHUB_SHA}"
            bash /opt/tectobox/scripts/deploy.sh

            echo "=== Deployment Completed Successfully! ==="
        env:
          GITHUB_SHA: ${{ github.sha }}
          DOMAIN_INPUT: ${{ steps.check-secrets.outputs.target_domain }}
