# ==============================================================================
# Tectobox Production Infrastructure & Services Stack
# Canonical production compose configuration (BP4 unified compose).
#
# Production Deploy Sequence:
# 1. Update source code:
#    git fetch origin && git merge --ff-only origin/main
# 2. Build images (WITHOUT --project-directory):
#    docker compose -f infra/docker-compose.prod.yml build
# 3. Apply database migrations (idempotent):
#    bash scripts/migrate.sh
# 4. Recreate containers (WITH -p tectobox --project-directory /opt/tectobox):
#    docker compose -f infra/docker-compose.prod.yml -p tectobox --project-directory /opt/tectobox up -d --remove-orphans
# 5. Service health & verification:
#    docker compose -f infra/docker-compose.prod.yml -p tectobox --project-directory /opt/tectobox ps
#
# Note: All services attach to tectobox_internal-net automatically by default;
# no manual network attach (docker network connect) is required afterwards.
# Reliability (Round 2, coordinator-applied from seg-07 notes): every service
# has a healthcheck + memory limit. Replicas stay 1 everywhere: container_name
# is set (replicas > 1 would collide) and workers share SESSION_DIR files +
# one Baileys socket per account, so a second replica risks session
# corruption. See STATE-20261114-R2.md.
# ==============================================================================

name: tectobox

services:
  # Edge Gateway / Reverse Proxy with Automatic SSL and Security Headers
  gateway:
    image: caddy:2-alpine
    container_name: tectobox-prod-gateway
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 100M
    # Caddy admin API is off (admin off in Caddyfile), so probe :80 instead:
    # :80 serves plain HTTP with no redirect; a 200 proves Caddy is up.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tectobox_caddy_data:/data
      - tectobox_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      ingress:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: tectobox-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tectobox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tectobox_prod_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tectobox}
    volumes:
      - tectobox_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tectobox}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tectobox-prod-redis
    restart: unless-stopped
    volumes:
      - tectobox_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-tectobox_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-tectobox_redis_secret}

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tectobox-prod-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tectobox}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-tectobox_rabbit_secret}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    volumes:
      - tectobox_rabbitmqdata:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai:
    image: ghcr.io/${IMAGE_REPO_OWNER:-th3urbanguy}/tectobox-ai:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: infra/Dockerfile.ai.prod
    container_name: tectobox-prod-ai
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 350M
    environment:
      PORT: 8081
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ingress:
    image: ghcr.io/${IMAGE_REPO_OWNER:-th3urbanguy}/tectobox-ingress:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: infra/Dockerfile.ingress.prod
    container_name: tectobox-prod-ingress
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 150M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      PORT: 8080
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tectobox}:${RABBITMQ_PASS:-tectobox_rabbit_secret}@rabbitmq:5672/
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      rabbitmq:
        condition: service_healthy

  api:
    image: ghcr.io/${IMAGE_REPO_OWNER:-th3urbanguy}/tectobox-api:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: infra/Dockerfile.api.prod
    container_name: tectobox-prod-api
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 400M
    environment:
      PORT: 3120
      DATABASE_URL: postgres://${POSTGRES_USER:-tectobox}:${POSTGRES_PASSWORD:-tectobox_prod_secret}@postgres:5432/${POSTGRES_DB:-tectobox}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tectobox_redis_secret}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tectobox}:${RABBITMQ_PASS:-tectobox_rabbit_secret}@rabbitmq:5672/
      GO_AI_URL: http://ai:8081/api/ai/chat
      GEMINI_WEB2API_URL: http://ai:8081/v1
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      NODE_ENV: production
      # Public base URL for inbound webhook URLs (Connect Channels page).
      BASE_URL: https://${DOMAIN:-box.tect0nic.com}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3120/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai:
        condition: service_healthy

  workers:
    image: ghcr.io/${IMAGE_REPO_OWNER:-th3urbanguy}/tectobox-workers:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: infra/Dockerfile.workers.prod
    container_name: tectobox-prod-workers
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 300M
    # Workers write a ms timestamp to /tmp/tectobox-workers-heartbeat every
    # 5s (see services/workers/src/index.ts startHeartbeat). The check fails
    # when the file is missing or older than 30s.
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'); try { const t=parseInt(fs.readFileSync('/tmp/tectobox-workers-heartbeat','utf8')); if(Date.now()-t > 30000) process.exit(1); } catch { process.exit(1); }"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tectobox}:${POSTGRES_PASSWORD:-tectobox_prod_secret}@postgres:5432/${POSTGRES_DB:-tectobox}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tectobox_redis_secret}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-tectobox}:${RABBITMQ_PASS:-tectobox_rabbit_secret}@rabbitmq:5672/
      SESSION_DIR: /data/sessions
    volumes:
      - infra_sessiondata:/data/sessions
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

networks:
  default:
    name: tectobox_internal-net

volumes:
  tectobox_pgdata:
    external: true
  tectobox_redisdata:
    external: true
  tectobox_rabbitmqdata:
    external: true
  infra_sessiondata:
    external: true
  tectobox_caddy_data:
    external: true
  tectobox_caddy_config:
    external: true
